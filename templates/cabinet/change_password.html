{% extends 'base.html' %}
{% block title %}{{ _('Зміна пароля') }} – SmartShop AI{% endblock %}

{% block extra_styles %}
<style>
    .password-card { max-width: 420px; margin: 3rem auto; }
</style>
{% endblock %}

{% block content %}
<section class="card password-card" style="padding: 2rem;">
    <h1 style="font-size: 1.3rem; margin-bottom: 1.25rem;">🔐 {{ _('Зміна пароля') }}</h1>

    <form method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>{{ _('Поточний пароль') }}</label>
            <input type="password" name="current_password" required style="width:100%; padding:0.6rem; border-radius:0.5rem; border:1px solid rgba(148,163,184,0.45); background:rgba(15,23,42,0.9); color:var(--text-main);">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>{{ _('Новий пароль') }}</label>
            <input type="password" name="new_password" required minlength="6" style="width:100%; padding:0.6rem; border-radius:0.5rem; border:1px solid rgba(148,163,184,0.45); background:rgba(15,23,42,0.9); color:var(--text-main);">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label>{{ _('Підтвердження нового пароля') }}</label>
            <input type="password" name="confirm_password" required minlength="6" style="width:100%; padding:0.6rem; border-radius:0.5rem; border:1px solid rgba(148,163,184,0.45); background:rgba(15,23,42,0.9); color:var(--text-main);">
        </div>
        <button type="submit" class="btn" style="width:100%;">{{ _('Змінити пароль') }}</button>
    </form>
</section>
{% endblock %}
