name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartshop
          POSTGRES_PASSWORD: smartshop
          POSTGRES_DB: smartshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartshop -d smartshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql://smartshop:smartshop@127.0.0.1:5432/smartshop
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-config=.coveragerc
