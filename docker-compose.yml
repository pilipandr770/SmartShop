services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartshop}
      POSTGRES_USER: ${POSTGRES_USER:-smartshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartshop}
    volumes:
      - smartshop_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartshop} -d ${POSTGRES_DB:-smartshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - smartshop_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartshop}:${POSTGRES_PASSWORD:-smartshop}@db:5432/${POSTGRES_DB:-smartshop}
      REDIS_URL: redis://redis:6379/0
      FLASK_APP: app.py
    ports:
      - "5000:5000"
    volumes:
      - smartshop_uploads:/app/static/uploads
      - smartshop_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  smartshop_pgdata:
  smartshop_uploads:
  smartshop_logs:
  smartshop_redis:
